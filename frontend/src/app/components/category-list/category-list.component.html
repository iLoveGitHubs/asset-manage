<h1 class="page-title">Categories</h1>

<div class="layout">
  <div class="card">
    <h2 class="section-title">Add New Category</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="catName">Name *</label>
        <input id="catName" type="text" formControlName="name" />
        <div *ngIf="isInvalid('name')" class="error-text">
          <span *ngIf="form.get('name')?.errors?.['required']">Name is required.</span>
          <span *ngIf="form.get('name')?.errors?.['maxlength']">Max 100 characters.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="catDesc">Description</label>
        <textarea id="catDesc" formControlName="description" rows="3"></textarea>
        <div *ngIf="isInvalid('description')" class="error-text">Max 500 characters.</div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Adding...' : 'Add Category' }}
      </button>
    </form>
  </div>

  <div>
    <div *ngIf="error" class="error-text">{{ error }}</div>
    <div *ngIf="loading" class="loading">Loading categories...</div>

    <table *ngIf="!loading && categories.length > 0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories">
          <td class="cat-name">{{ cat.name }}</td>
          <td>{{ cat.description || '—' }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && categories.length === 0 && !error" class="empty-state">
      No categories yet. Add one using the form.
    </div>
  </div>
</div>
